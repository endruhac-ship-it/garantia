<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Электронная гарантия</title><meta name="robots" content="noindex">
<style>
:root{--bg:#e9e9e6;--pp:#fff;--tx:#111;--mu:#6b6b66;--ok:#1d7a4f;--bad:#c0392b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 'Times New Roman',Georgia,serif;padding:14px}
.sheet{max-width:780px;margin:0 auto;background:var(--pp);padding:22px 20px 26px;box-shadow:0 2px 14px #0002;border-radius:4px}
.hd{text-align:center;font-size:18px;line-height:1.4;margin-bottom:12px}.hd b{font-size:21px;display:block;margin-top:2px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;table-layout:fixed}td,th{overflow-wrap:anywhere}td,th{border:1px solid #000;padding:6px 8px;vertical-align:middle;font-weight:400}
th{text-align:center;font-size:14px}.c{text-align:center;white-space:nowrap}.sk td,td.sk{font-weight:700;font-size:16px;padding:9px 8px}.as{font-style:italic;font-weight:700}
.ok{color:var(--ok);font-size:12px;display:block;font-family:system-ui,sans-serif}.bad{color:var(--bad);font-size:12px;display:block;font-family:system-ui,sans-serif}
.st{margin:14px 0 4px;padding:10px 12px;border-radius:8px;font:600 14px system-ui,sans-serif;background:#e8f3ed;color:var(--ok)}.st.bad{background:#fbeaea;color:var(--bad)}
.tm h4{margin:14px 0 3px;font-size:15px}.tm p{margin:0;font-size:12.5px;line-height:1.4}
.ft{margin-top:18px;font-size:13px;color:var(--mu);font-family:system-ui,sans-serif;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.ft a{color:#2f5d50}button{font:inherit;padding:7px 14px;border:1px solid #bbb;background:#fff;border-radius:8px;cursor:pointer}
.err{max-width:480px;margin:60px auto;text-align:center;color:var(--mu);font-family:system-ui,sans-serif}
@media(max-width:560px){body{padding:8px}.sheet{padding:16px 10px 20px}td,th{padding:5px 4px;font-size:13px}th{font-size:12px}.sk td,td.sk{font-size:14px}}
@media print{body{background:#fff;padding:0}.sheet{box-shadow:none;max-width:none;padding:0}.ft button{display:none}}
</style></head><body><div id=app></div>
<script>
const TERMS="## Условия предоставления гарантии:\n1. Гарантийный ремонт оборудования проводится при предъявлении клиентом полностью заполненного гарантийного талона.\n2. Доставка оборудования, подлежащего гарантийному ремонту, в сервисную службу осуществляется клиентом самостоятельно и за свой счет, если иное не оговорено в дополнительных письменных соглашениях.\n3. Гарантийные обязательства не распространяются на материалы и детали, считающиеся расходуемыми в процессе эксплуатации.\n## Условия прерывания гарантийных обязательств:\nГарантийные обязательства могут быть прерваны в следующих случаях:\n1. Несоответствие серийного номера предъявляемого на гарантийное обслуживание оборудования серийному номеру, указанному в гарантийном талоне.\n2. Невозможность считать серийный номер на оборудовании ввиду его повреждения или утраты.\n3. Наличие явных или скрытых механических повреждений оборудования, вызванных нарушением правил транспортировки, хранения или эксплуатации.\n4. Выявленное в процессе ремонта несоответствие Правилам и условиям эксплуатации, предъявляемым к оборудованию данного типа.\n5. Повреждение контрольных этикеток и пломб (если таковые имеются).\n6. Наличие внутри компьютерной техники посторонних предметов, независимо от их природы (тараканов в том числе), если возможность подобного не оговорена в технической.";
const $=document.getElementById.bind(document),el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const b64d=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
async function inf(u){const ds=new DecompressionStream('deflate-raw'),w=ds.writable.getWriter();w.write(u);w.close();return new Uint8Array(await new Response(ds.readable).arrayBuffer())}
async function dec(h){const k=h[0];let u=b64d(h.slice(1));if(k=='a'||k=='b')u=await inf(u);return JSON.parse(new TextDecoder(k=='a'||k=='c'?'windows-1251':'utf-8').decode(u))}
const MN=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'],fd=d=>d.toLocaleDateString('ru-RU');
const addM=(d,m)=>{const x=new Date(d.getFullYear(),d.getMonth()+m,d.getDate());return x};
function fail(t){const a=$('app');a.textContent='';const e=el('div','err',t);a.append(e)}
async function main(){
 const h=location.hash.slice(1);if(!h)return fail('Откройте ссылку из QR-кода на гарантийном талоне.');
 let o;try{o=await dec(h)}catch(e){return fail('Не удалось прочитать данные гарантии. Отсканируйте QR-код ещё раз.')}
 const[v,shop,usn,seller,ymd,insta,terms,bl]=o,y=Math.floor(ymd/10000),mo=Math.floor(ymd/100)%100,dd=ymd%100,d0=new Date(y,mo-1,dd),now=new Date();now.setHours(0,0,0,0);
 const sheet=el('div','sheet'),hd=el('div','hd');hd.append(shop||'');hd.append(el('br'));hd.append('УСН № '+(usn||''));hd.append(el('b',0,'ГАРАНТИЙНЫЙ ТАЛОН'));sheet.append(hd);
 const tw=el('div','tw'),t=el('table'),cg=el('colgroup');['42%','22%','10%','26%'].forEach(w=>{const c=el('col');c.style.width=w;cg.append(c)});t.append(cg);const add=(...c)=>{const r=el('tr');c.forEach(x=>r.append(x));t.append(r);return r};
 const td=(x,c,span)=>{const e=el('td',c,x);if(span)e.colSpan=span;return e};
 add(td('ПРОДАВЕЦ','sk'),td(seller||'','sk',3));
 const tr=add(...['Название продукции, товара или комплектующих','Серийный номер','Кол-во','Гарантия'].map(x=>el('th',0,x)));
 let sum=0,best=null,any=false,live=false;
 const upd=(m)=>{const e=addM(d0,m);any=true;if(e>=now)live=true;if(!best||e>best)best=e;return e};
 (bl||[]).forEach(b=>{const[tot,bs,rows]=b;sum+=bs||0;
  if(tot){const e=upd(tot);add(td('Гарантия на сборку: '+tot+' мес. (до '+fd(e)+')','as',4))}
  rows.forEach(r=>{const[name,sn,q,m]=r,c=td('','c');const cell=td(name);const g=td('','c');
   if(m>0){const e=upd(m),act=e>=now;g.append(m+' мес.');const s=el('span',act?'ok':'bad',(act?'действует до ':'истекла ')+fd(e));g.append(s)}else g.append('—');
   const row=add(cell,td(sn||''),td(q||1,'c'),g)})});
 add(td('ИТОГОВАЯ СУММА:','sk'),td(sum.toLocaleString('ru-RU')+' руб.','sk',3));
 tw.append(t);
 const info=el('div',0,'Дата продажи: «'+dd+'» '+MN[mo-1]+' '+y+' г.');info.style.margin='10px 0 0';
 sheet.append(tw,info);
 if(any){const s=el('div','st'+(live?'':' bad'),live?'Гарантия действует'+(best?' до '+fd(best):''):'Срок гарантии истёк'+(best?' '+fd(best):''));sheet.append(s)}
 const tm=el('div','tm');String(terms||TERMS).split('\n').forEach(l=>{if(l.startsWith('## '))tm.append(el('h4',0,l.slice(3)));else tm.append(el('p',0,l))});sheet.append(tm);
 const ft=el('div','ft');const left=el('span');if(/^https?:\/\//i.test(insta||'')){const a=el('a',0,'Instagram магазина');a.href=insta;a.rel='noopener';left.append(a)}ft.append(left);
 const pb=el('button',0,'Распечатать / сохранить PDF');pb.onclick=()=>print();ft.append(pb);sheet.append(ft);
 $('app').textContent='';$('app').append(sheet);document.title='Гарантия · '+(shop||'');
}
main();
</script></body></html>
